name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: wf_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/wf_test
      DATABASE_URL: postgresql://postgres:test@localhost:5432/wf_test
      FRONTEND_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci_secret_ci_secret_ci_secret_ci_secret_123
      OWNER_EMAIL: owner@test.local
      OWNER_PASSWORD: OwnerPassword#12345
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install # depois de versionar o package-lock.json, troque por npm ci
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - run: npm run build
